name: mr
description: "MR educational app for students and assistants."
publish_to: 'none'

# Single source of truth for the release version.
# version_name = 4.0.11, version_code = 11.
# version_code MUST always increase; never reuse or decrease it.
version: 5.0.2+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # UI
  flutter_screenutil: ^5.9.3
  gap: ^3.0.1
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # Networking / state plumbing
  dio: ^5.4.0
  dartz: ^0.10.1
  get_it: ^7.6.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.2.0
  sqflite: ^2.4.2
  path: ^1.9.1

  # Features
  qr: ^4.0.0
  ai_barcode_scanner: ^7.1.0
  youtube_player_flutter: ^10.0.1

  # Update flow
  package_info_plus: ^9.0.1
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  sqflite_common_ffi: ^2.3.6
  package_info_plus_platform_interface: ^3.2.1
  path_provider_platform_interface: ^2.1.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png

flutter:
  uses-material-design: true

  # Only assets that are actually loaded at runtime. Keeping this list explicit
  # prevents unreferenced images from bloating the APK.
  assets:
    - assets/item2.png
    - assets/item3.png
    - assets/token_atom.png
    - assets/onboarding1.png
    - assets/onboarding2.png

  # Bundled fonts (SIL Open Font License, see assets/fonts/*-OFL.txt).
  # Bundling removes the runtime download dependency on Google Fonts.
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-300.ttf
          weight: 300
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
        - asset: assets/fonts/Cairo-800.ttf
          weight: 800
        - asset: assets/fonts/Cairo-900.ttf
          weight: 900
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
