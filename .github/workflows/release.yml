name: Release Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'pubspec.yaml'
      - 'CHANGELOG.md'
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A release must never be cancelled halfway through an upload/publish.
  cancel-in-progress: false

env:
  # Backend
  BACKEND_BASE_URL: 'https://mr-edu.ertiqaa.site/api/v1'
  FLUTTER_VERSION: '3.47.9'

  # Server deploy location (no credentials here)
  SERVER_REMOTE_DIR: '/var/www/educational_platforms/mr-edu.ertiqaa.site/storage/app/public/releases'

jobs:
  release:
    name: Build, upload and publish release
    # Governance: production releases are built only from main, whether the
    # run was triggered by a push or manually. A manual dispatch from any other
    # branch is skipped instead of publishing unreviewed code.
    if: github.ref == 'refs/heads/main'
    # Configure required reviewers for this environment in
    # Settings -> Environments -> production to require an approval before any
    # secret is exposed to the job (see docs/CI_CD_RELEASE.md).
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      apk_name: ${{ steps.apk.outputs.apk_name }}

    steps:

      # ------------------------------------------------------------------
      # Stage 1 - Checkout
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ------------------------------------------------------------------
      # Stage 2 - Setup Java
      # ------------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ------------------------------------------------------------------
      # Stage 3 - Setup Flutter (pinned)
      # ------------------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # ------------------------------------------------------------------
      # Stage 4 - Dependencies
      # ------------------------------------------------------------------
      - name: Flutter pub get (lockfile enforced)
        run: flutter pub get --enforce-lockfile

      # ------------------------------------------------------------------
      # Stage 4b - Quality gate (the release must pass the same checks as PRs)
      # ------------------------------------------------------------------
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      # ------------------------------------------------------------------
      # Stage 5 - Read version from pubspec.yaml
      # ------------------------------------------------------------------
      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # Strip the key and leading whitespace, then normalize any trailing
          # whitespace (spaces/tabs/CR) so harmless padding cannot leak into
          # version_name/version_code. Format validation below stays strict.
          version_line="$(grep -m1 -E '^version: ' pubspec.yaml \
            | sed -E 's/^version:[[:space:]]*//; s/[[:space:]]+$//' \
            || true)"

          if [[ -z "$version_line" ]]; then
            echo "::error::Could not find a 'version:' line in pubspec.yaml"
            exit 1
          fi

          version_name="${version_line%%+*}"
          version_code="${version_line#*+}"

          if [[ -z "$version_name" || -z "$version_code" ]]; then
            echo "::error::pubspec.yaml version '$version_line' must be <name>+<code> e.g. 2.1.0+2"
            exit 1
          fi

          if ! [[ "$version_code" =~ ^[0-9]+$ ]]; then
            echo "::error::version_code '$version_code' is not a positive integer"
            exit 1
          fi

          if ! [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version_name '$version_name' is not in X.Y.Z format"
            exit 1
          fi

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

          echo "VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"

          echo "Extracted version_name=$version_name version_code=$version_code"

      # ------------------------------------------------------------------
      # Stage 6 - Read changelog
      # ------------------------------------------------------------------
      - name: Read changelog
        shell: bash
        run: |
          set -euo pipefail

          version_name="${{ steps.version.outputs.version_name }}"

          if [[ ! -f CHANGELOG.md ]]; then
            echo "::error::CHANGELOG.md not found at repository root"
            exit 1
          fi

          changelog="$(awk -v v="## $version_name" '
            $0 == v { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"

          if [[ -z "$changelog" ]]; then
            echo "::error::No changelog section found for version '$version_name' in CHANGELOG.md"
            echo "::error::Add a section like: ## $version_name"
            exit 1
          fi

          printf '%s\n' "$changelog" > "$GITHUB_WORKSPACE/changelog.txt"

          echo "Changelog section for $version_name:"
          echo "-------------------------------"
          cat "$GITHUB_WORKSPACE/changelog.txt"
          echo "-------------------------------"

      # ------------------------------------------------------------------
      # Stage 7 - Pre-check latest release on Backend
      # ------------------------------------------------------------------
      - name: Pre-check latest release on Backend
        shell: bash
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -uo pipefail

          http_code="000"
          body=""

          for attempt in 1 2 3; do
            resp="$(set +e; curl -sS -w '\n%{http_code}' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              "$BACKEND_BASE_URL/app/releases/latest"; set -e)" || true

            http_code="$(echo "$resp" | tail -n1)"
            body="$(echo "$resp" | sed '$d')"

            case "$http_code" in
              200|404|204)
                break
                ;;
            esac

            if [[ "$attempt" -lt 3 ]]; then
              sleep 5
            fi
          done

          case "$http_code" in
            200)
              # `data: null` (no release yet) is the only case treated as 0.
              # A release object WITHOUT a numeric version_code is an error:
              # previously it silently became 0 (or a bash comparison error
              # that `set -u` without `-e` ignored) and the check "passed".
              latest_code="$(echo "$body" | jq -r '
                if (has("data") and .data == null) then "0"
                else ((.data // .).version_code // "missing") | tostring
                end' 2>/dev/null || echo "invalid")"

              if ! [[ "$latest_code" =~ ^[0-9]+$ ]]; then
                echo "::error::Backend latest response did not include a numeric version_code (got '$latest_code')."
                echo "$body" | head -c 500 >&2
                exit 1
              fi

              if [[ "$latest_code" -ge "$VERSION_CODE" ]]; then
                echo "::error::Backend already has version_code=$latest_code which is >= this build's version_code=$VERSION_CODE."
                echo "::error::Increment the version in pubspec.yaml before releasing."
                exit 1
              fi

              echo "Pre-check passed: latest backend code ($latest_code) < this build ($VERSION_CODE)"
              ;;

            404|204)
              echo "Backend has no releases yet (HTTP $http_code). Proceeding."
              ;;

            *)
              echo "::error::Could not reach/verify Backend latest release (HTTP $http_code after 3 attempts)."
              echo "$body" | head -c 500 >&2
              exit 1
              ;;
          esac

      # ------------------------------------------------------------------
      # Stage 8 - Prepare signing keystore
      #
      # IMPORTANT:
      # build.gradle.kts is inside android/app
      #
      # Therefore storeFile=upload-keystore.jks
      # resolves to:
      #
      # android/app/upload-keystore.jks
      # ------------------------------------------------------------------
      - name: Prepare signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$ANDROID_KEYSTORE_BASE64" ||
                -z "$KEYSTORE_PASSWORD" ||
                -z "$KEY_ALIAS" ||
                -z "$KEY_PASSWORD" ]]; then

            echo "::error::Missing one or more signing secrets."
            exit 1
          fi

          # Decode keystore directly into android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d \
            > "$GITHUB_WORKSPACE/android/app/upload-keystore.jks"

          if [[ ! -s "$GITHUB_WORKSPACE/android/app/upload-keystore.jks" ]]; then
            echo "::error::Decoded keystore file is empty. Verify ANDROID_KEYSTORE_BASE64."
            exit 1
          fi

          # keystore.properties is located in android/
          keystore_props="$GITHUB_WORKSPACE/android/keystore.properties"

          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$keystore_props"

          echo "Keystore prepared successfully."
          echo "Keystore location: android/app/upload-keystore.jks"

      # ------------------------------------------------------------------
      # Stage 9 - Build signed release APK
      # ------------------------------------------------------------------
      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk --release \
            --dart-define=APP_ENV=production \
            --dart-define=API_BASE_URL="$BACKEND_BASE_URL" \
            --dart-define=STORAGE_BASE_URL='https://mr-edu.ertiqaa.site/storage'

          echo "Release APK built successfully."

      # ------------------------------------------------------------------
      # Stage 9a - Verify APK identity and version match the repository
      #
      # This catches stale/wrong APKs (wrong applicationId, reused/downgraded
      # versionCode) before anything is uploaded.
      # ------------------------------------------------------------------
      - name: Verify APK identity and version
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail

          apk="$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-release.apk"
          test -f "$apk" || { echo "::error::Release APK not found."; exit 1; }

          expected_id="$(
            sed -nE 's/.*applicationId[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              android/app/build.gradle.kts | head -n1
          )"

          if [[ -z "$expected_id" ]]; then
            echo "::error::Could not read applicationId from android/app/build.gradle.kts."
            exit 1
          fi

          aapt=""
          for sdk in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}"; do
            if [[ -n "$sdk" && -d "$sdk/build-tools" ]]; then
              aapt="$(find "$sdk/build-tools" -name aapt -type f 2>/dev/null | sort -V | tail -n1)"
              [[ -n "$aapt" ]] && break
            fi
          done

          test -n "$aapt" || { echo "::error::aapt not found in Android SDK build-tools."; exit 1; }

          badging="$("$aapt" dump badging "$apk")"
          actual_id="$(sed -nE "s/^package: name='([^']+)'.*/\1/p" <<< "$badging")"
          actual_code="$(sed -nE "s/^package:.*versionCode='([0-9]+)'.*/\1/p" <<< "$badging")"
          actual_name="$(sed -nE "s/^package:.*versionName='([^']*)'.*/\1/p" <<< "$badging")"

          echo "APK identity: id=$actual_id versionCode=$actual_code versionName=$actual_name"

          if [[ "$actual_id" != "$expected_id" ]]; then
            echo "::error::applicationId mismatch: gradle=$expected_id apk=$actual_id"
            exit 1
          fi
          if [[ "$actual_code" != "$VERSION_CODE" ]]; then
            echo "::error::versionCode mismatch: pubspec=$VERSION_CODE apk=$actual_code"
            exit 1
          fi
          if [[ "$actual_name" != "$VERSION_NAME" ]]; then
            echo "::error::versionName mismatch: pubspec=$VERSION_NAME apk=$actual_name"
            exit 1
          fi

          # The updater depends on this permission to open the package installer.
          if ! grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' \
            <<< "$badging"; then
            echo "::error::APK is missing REQUEST_INSTALL_PACKAGES permission."
            exit 1
          fi

          echo "Verified APK identity and version."

      # ------------------------------------------------------------------
      # Stage 9b - Verify the release APK is signed with the Production keystore
      #
      # Guards against a Debug-signing fallback: the certificate used to sign
      # the APK MUST be the same certificate stored in ANDROID_KEYSTORE_BASE64.
      # ------------------------------------------------------------------
      - name: Verify APK signature matches Production keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          apk="$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-release.apk"
          keystore="$GITHUB_WORKSPACE/android/app/upload-keystore.jks"

          test -f "$apk" || { echo "::error::Release APK not found."; exit 1; }
          test -f "$keystore" || { echo "::error::Keystore not found."; exit 1; }

          # Locate apksigner (Android SDK build-tools).
          # GitHub-hosted runners provide ANDROID_HOME / ANDROID_SDK_ROOT
          # (ANDROID_SDK_HOME is NOT a standard runner variable, so it must not
          # be referenced with `set -u`). Use safe default expansions so the
          # script stays compatible with `set -euo pipefail`.
          apksigner=""
          for sdk in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}"; do
            if [[ -n "$sdk" && -d "$sdk/build-tools" ]]; then
              apksigner="$(find "$sdk/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n1)"
              [[ -n "$apksigner" ]] && break
            fi
          done

          test -n "$apksigner" || { echo "::error::apksigner not found in Android SDK build-tools."; exit 1; }

          expected="$(
            keytool -list -v \
              -keystore "$keystore" \
              -alias "$KEY_ALIAS" \
              -storepass "$KEYSTORE_PASSWORD" 2>/dev/null |
            sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*([0-9A-Fa-f:]+)/\1/p' |
            head -n1 | tr -d ':' | tr 'A-F' 'a-f'
          )"

          actual="$(
            "$apksigner" verify --print-certs "$apk" 2>/dev/null |
            sed -nE 's/.*certificate SHA-256 digest: ([0-9a-f]{64}).*/\1/p' |
            head -n1
          )"

          if [[ -z "$expected" || -z "$actual" ]]; then
            echo "::error::Could not read signing certificate(s) (expected='$expected' actual='$actual')."
            exit 1
          fi

          if [[ "$expected" != "$actual" ]]; then
            echo "::error::Release APK is NOT signed with the Production keystore."
            echo "::error::Expected SHA-256: $expected"
            echo "::error::Actual SHA-256:   $actual"
            echo "::error::The APK must be signed with the keystore from ANDROID_KEYSTORE_BASE64 only."
            exit 1
          fi

          echo "Verified: release APK signed with the Production keystore (SHA-256: $actual)."

      # ------------------------------------------------------------------
      # Stage 10 - Locate and rename APK
      # ------------------------------------------------------------------
      - name: Locate and rename APK
        id: apk
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail

          apk="$(find build/app/outputs/flutter-apk \
            -name 'app-release.apk' \
            -type f | head -n1)"

          if [[ -z "$apk" ]]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          # The file name MUST be unique per build. It used to be
          # app-v<version_name>.apk, so two builds sharing a version_name
          # (e.g. after reverting pubspec.yaml) overwrote the file that the
          # currently published release still pointed to: devices then
          # downloaded an APK whose versionCode/size no longer matched the
          # metadata. version_code is unique and strictly increasing.
          apk_name="app-v${VERSION_NAME}-${VERSION_CODE}.apk"

          cp "$apk" "$GITHUB_WORKSPACE/$apk_name"

          echo "APK_FILE=${GITHUB_WORKSPACE}/${apk_name}" >> "$GITHUB_ENV"
          echo "APK_NAME=$apk_name" >> "$GITHUB_ENV"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

          if [[ ! -f "$GITHUB_WORKSPACE/$apk_name" ]]; then
            echo "::error::Renamed APK missing."
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/$apk_name"

      # ------------------------------------------------------------------
      # Stage 10b - Compute SHA-256 and keep the artifact
      # ------------------------------------------------------------------
      - name: Compute APK SHA-256
        id: checksum
        shell: bash
        run: |
          set -euo pipefail

          sha="$(sha256sum "$APK_FILE" | awk '{print $1}')"
          if [[ ! "$sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Could not compute a valid SHA-256 for $APK_FILE."
            exit 1
          fi

          printf '%s  %s\n' "$sha" "$APK_NAME" > "$APK_FILE.sha256"
          echo "APK_SHA256=$sha" >> "$GITHUB_ENV"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

          echo "APK SHA-256: $sha"

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-apk-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: |
            ${{ env.APK_FILE }}
            ${{ env.APK_FILE }}.sha256
          if-no-files-found: error
          # Long enough to diagnose a bad release or re-upload the exact
          # verified artifact after the fact.
          retention-days: 90

      # ------------------------------------------------------------------
      # Stage 11 - Upload APK to server (strict host key + atomic move)
      # ------------------------------------------------------------------
      - name: Upload APK to server
        id: upload
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ vars.SERVER_PORT }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
          APK_SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          set -euo pipefail

          if [[ -z "$SSH_KEY" || -z "$HOST" || -z "$USER" ]]; then
            echo "::error::Missing SSH secrets."
            exit 1
          fi

          if [[ -z "${SERVER_KNOWN_HOSTS:-}" ]]; then
            echo "::error::SERVER_KNOWN_HOSTS secret is required."
            echo "::error::Host-key verification is never disabled for releases."
            exit 1
          fi

          ssh_port="${PORT:-22}"
          key_file="$(mktemp)"
          hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT

          printf '%s\n' "$SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$hosts_file"
          chmod 600 "$hosts_file"

          ssh_extra=(
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$hosts_file"
            -o ConnectTimeout=20
          )

          remote_path="${SERVER_REMOTE_DIR}/${APK_NAME}"
          remote_tmp="${remote_path}.part"

          echo "Uploading $APK_NAME to $USER@$HOST:$SERVER_REMOTE_DIR/ (atomic)..."

          # Never overwrite an existing release file: it may be the artifact
          # that the currently published release (or a rollback target) points
          # to. With version_code in the name this only happens when the same
          # build is re-run, which must be resolved manually.
          if ssh "${ssh_extra[@]}" -p "$ssh_port" -i "$key_file" \
              "${USER}@${HOST}" "test -e '${remote_path}'"; then
            echo "::error::${remote_path} already exists on the server; refusing to overwrite it."
            echo "::error::Bump version_code in pubspec.yaml or remove the stale file manually after confirming it is not referenced by any release."
            exit 1
          fi

          ssh "${ssh_extra[@]}" -p "$ssh_port" -i "$key_file" \
            "${USER}@${HOST}" \
            "mkdir -p '${SERVER_REMOTE_DIR}' && rm -f '${remote_tmp}'"

          scp "${ssh_extra[@]}" -P "$ssh_port" -i "$key_file" \
            "$APK_FILE" \
            "${USER}@${HOST}:${remote_tmp}"

          remote_sha="$(
            ssh "${ssh_extra[@]}" -p "$ssh_port" -i "$key_file" \
              "${USER}@${HOST}" \
              "sha256sum '${remote_tmp}' 2>/dev/null || shasum -a 256 '${remote_tmp}'" \
            | awk '{print $1}'
          )"

          if [[ "$remote_sha" != "$APK_SHA256" ]]; then
            echo "::error::Uploaded APK checksum mismatch (local=$APK_SHA256 remote=$remote_sha)."
            ssh "${ssh_extra[@]}" -p "$ssh_port" -i "$key_file" \
              "${USER}@${HOST}" "rm -f '${remote_tmp}'" || true
            exit 1
          fi

          # Atomic move into place. -n refuses to clobber a file that appeared
          # concurrently. Previous releases keep their own unique files, which
          # are the rollback artifacts (see docs/ROLLBACK.md).
          ssh "${ssh_extra[@]}" -p "$ssh_port" -i "$key_file" \
            "${USER}@${HOST}" \
            "mv -n '${remote_tmp}' '${remote_path}' && test ! -e '${remote_tmp}'"

          echo "SCP upload completed and atomically published."

      # ------------------------------------------------------------------
      # Stage 12 - Verify uploaded APK on the server
      # ------------------------------------------------------------------
      - name: Verify uploaded APK on server
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ vars.SERVER_PORT }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
          APK_SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          set -euo pipefail

          if [[ -z "${SERVER_KNOWN_HOSTS:-}" ]]; then
            echo "::error::SERVER_KNOWN_HOSTS secret is required."
            exit 1
          fi

          ssh_port="${PORT:-22}"
          key_file="$(mktemp)"
          hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT

          printf '%s\n' "$SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$hosts_file"
          chmod 600 "$hosts_file"

          ssh_extra=(
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$hosts_file"
            -o ConnectTimeout=20
          )

          remote_path="${SERVER_REMOTE_DIR}/${APK_NAME}"

          remote_sha="$(
            ssh "${ssh_extra[@]}" -p "$ssh_port" -i "$key_file" \
              "${USER}@${HOST}" \
              "test -f '${remote_path}' && (sha256sum '${remote_path}' 2>/dev/null || shasum -a 256 '${remote_path}')" \
            | awk '{print $1}'
          )"

          if [[ "$remote_sha" != "$APK_SHA256" ]]; then
            echo "::error::Uploaded APK missing or checksum mismatch at ${remote_path}."
            echo "::error::Expected $APK_SHA256, got '$remote_sha'."
            exit 1
          fi

          echo "Verified server APK checksum: ${remote_path} ($remote_sha)"

      # ------------------------------------------------------------------
      # Stage 13 - Login to Backend
      # ------------------------------------------------------------------
      - name: Login to Backend
        shell: bash
        env:
          BACKEND_USERNAME: ${{ secrets.BACKEND_USERNAME }}
          BACKEND_PASSWORD: ${{ secrets.BACKEND_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$BACKEND_USERNAME" || -z "$BACKEND_PASSWORD" ]]; then
            echo "::error::Missing Backend credentials secrets."
            exit 1
          fi

          login_payload="$(jq -n \
            --arg u "$BACKEND_USERNAME" \
            --arg p "$BACKEND_PASSWORD" \
            '{username: $u, password: $p}')"

          resp="$(curl -sS -w '\n%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -d "$login_payload" \
            "$BACKEND_BASE_URL/auth/login")"

          http_code="$(echo "$resp" | tail -n1)"
          body="$(echo "$resp" | sed '$d')"

          if [[ "$http_code" != "2"* ]]; then
            echo "::error::Backend login failed (HTTP $http_code)."
            echo "$body" | head -c 500 >&2
            exit 1
          fi

          token="$(echo "$body" | jq -r '.data.token // empty')"

          if [[ -z "$token" ]]; then
            echo "::error::Login response did not contain data.token."
            echo "$body" | head -c 500 >&2
            exit 1
          fi

          echo "::add-mask::$token"

          echo "BACKEND_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"

          echo "Logged in to Backend successfully."

      # ------------------------------------------------------------------
      # Stage 14 - Publish release to Backend API
      # ------------------------------------------------------------------
      - name: Publish release to Backend
        id: publish
        shell: bash
        env:
          BACKEND_USERNAME: ${{ secrets.BACKEND_USERNAME }}
          BACKEND_PASSWORD: ${{ secrets.BACKEND_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
          APK_SHA256: ${{ steps.checksum.outputs.sha256 }}
          # Set the repository variable PUBLISH_INTEGRITY_FIELDS=true only
          # after the backend accepts and stores `sha256` and `file_size`
          # (see docs/UPDATE_FLOW.md). Until then they are not sent, so an
          # older backend never rejects the publish because of unknown fields.
          PUBLISH_INTEGRITY_FIELDS: ${{ vars.PUBLISH_INTEGRITY_FIELDS }}
        run: |
          set -euo pipefail

          changelog_file="$GITHUB_WORKSPACE/changelog.txt"

          payload="$(jq -n \
            --argjson vc "$VERSION_CODE" \
            --arg vn "$VERSION_NAME" \
            --arg cl "$(cat "$changelog_file")" \
            --arg fn "$APK_NAME" \
            '{
              version_code: $vc,
              version_name: $vn,
              changelog: $cl,
              file_name: $fn
            }')"

          if [[ "${PUBLISH_INTEGRITY_FIELDS:-}" == "true" ]]; then
            apk_size="$(stat -c%s "$APK_FILE")"
            payload="$(jq \
              --arg sha "$APK_SHA256" \
              --argjson size "$apk_size" \
              '. + {sha256: $sha, file_size: $size}' <<< "$payload")"
            echo "Including integrity fields (sha256, file_size=$apk_size)."
          fi

          do_login() {
            local login_payload
            local resp
            local code
            local body
            local parsed_token

            login_payload="$(jq -n \
              --arg u "$BACKEND_USERNAME" \
              --arg p "$BACKEND_PASSWORD" \
              '{username: $u, password: $p}')"

            resp="$(curl -sS -w '\n%{http_code}' \
              -X POST \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -d "$login_payload" \
              "$BACKEND_BASE_URL/auth/login")"

            code="$(echo "$resp" | tail -n1)"
            body="$(echo "$resp" | sed '$d')"

            if [[ "$code" != "2"* ]]; then
              echo "::error::Backend login failed while refreshing token."
              echo "$body" | head -c 500 >&2
              return 1
            fi

            parsed_token="$(echo "$body" | jq -r '.data.token // empty')"

            if [[ -z "$parsed_token" ]]; then
              echo "::error::Refreshed login did not contain data.token."
              return 1
            fi

            echo "::add-mask::$parsed_token"

            TOKEN="$parsed_token"
          }

          TOKEN="${BACKEND_ACCESS_TOKEN:-}"

          if [[ -z "$TOKEN" ]]; then
            echo "::error::No Backend Access Token available."
            exit 1
          fi

          http_code=""

          for attempt in 1 2; do

            echo "POSTing release to $BACKEND_BASE_URL/app/releases (attempt $attempt)..."

            response="$(curl -sS -w '\n%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -d "$payload" \
              "$BACKEND_BASE_URL/app/releases")"

            http_code="$(echo "$response" | tail -n1)"
            body="$(echo "$response" | sed '$d')"

            if [[ "$http_code" == "2"* ]]; then
              echo "Backend responded with HTTP $http_code. Release published."
              break
            fi

            if [[ "$http_code" == "401" && "$attempt" == "1" ]]; then

              echo "::warning::Backend returned 401 Unauthorized."
              echo "::warning::Logging in again and retrying once..."

              do_login

              continue
            fi

            echo "::error::Backend rejected the release publish (HTTP $http_code)."
            echo "::error::$body"

            exit 1
          done

          if [[ "$http_code" != "2"* ]]; then
            echo "::error::Release publish failed after retry (final HTTP $http_code)."
            exit 1
          fi

          echo "::group::Publish response"
          echo "$body"
          echo "::endgroup::"

      # ------------------------------------------------------------------
      # Stage 15 - Verify latest release
      # ------------------------------------------------------------------
      - name: Verify latest release on Backend
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do

            echo "Verification attempt $attempt of 3..."

            # `|| true` so a transient connection error is retried instead of
            # aborting the step on the first attempt under `set -e`.
            resp="$(curl -sS -w '\n%{http_code}' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              "$BACKEND_BASE_URL/app/releases/latest" || true)"

            code="$(echo "$resp" | tail -n1)"
            body="$(echo "$resp" | sed '$d')"

            if [[ "$code" == "200" ]]; then
              echo "$body" > "$GITHUB_WORKSPACE/latest.json"
              break
            fi

            if [[ "$attempt" == "3" ]]; then
              echo "::error::Backend latest endpoint did not return HTTP 200 after 3 attempts."
              echo "::error::$body"
              exit 1
            fi

            sleep 5
          done

          latest="$GITHUB_WORKSPACE/latest.json"

          row="$(jq -r '
            [( .data // . ) as $o |
            ($o.version_code // ""),
            ($o.version_name // ""),
            ($o.file_name // "")] |
            @tsv
          ' "$latest")"

          IFS=$'\t' read -r got_code got_name got_file <<< "$row"

          exp_code="$VERSION_CODE"
          exp_name="$VERSION_NAME"
          exp_file="$APK_NAME"

          ok=true

          if [[ "$got_code" != "$exp_code" ]]; then
            echo "::error::version_code mismatch: expected $exp_code, got $got_code"
            ok=false
          fi

          if [[ "$got_name" != "$exp_name" ]]; then
            echo "::error::version_name mismatch: expected $exp_name, got $got_name"
            ok=false
          fi

          if [[ "$got_file" != "$exp_file" ]]; then
            echo "::error::file_name mismatch: expected $exp_file, got $got_file"
            ok=false
          fi

          if [[ "$ok" != true ]]; then
            echo "Returned latest release:"
            cat "$latest"
            exit 1
          fi

          echo "Verified latest release matches published release:"
          echo "version_code=$got_code"
          echo "version_name=$got_name"
          echo "file_name=$got_file"

      # ------------------------------------------------------------------
      # Stage 16 - Strict download verification
      #
      # Downloads the artifact exactly as a device would and compares its
      # SHA-256 with the built APK. Any mismatch fails the release.
      # ------------------------------------------------------------------
      - name: Verify download endpoint serves the exact APK
        shell: bash
        env:
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
          APK_SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          set -euo pipefail

          url="$(
            jq -r '[ (.data // .) | (.file_url // "") ] | first' \
              "$GITHUB_WORKSPACE/latest.json"
          )"

          if [[ -z "$url" || "$url" == "null" ]]; then
            url="$BACKEND_BASE_URL/app/releases/latest/download"
            echo "Release metadata has no file_url; verifying fallback endpoint."
          fi

          echo "Downloading: $url"

          http_code="$(
            curl -sSL \
              --retry 3 --retry-delay 5 --max-time 300 \
              -o "$GITHUB_WORKSPACE/downloaded.apk" \
              -w '%{http_code}' \
              -H 'Accept: application/vnd.android.package-archive' \
              "$url"
          )"

          if [[ "$http_code" != "200" ]]; then
            echo "::error::Download endpoint returned HTTP $http_code (expected 200)."
            exit 1
          fi

          downloaded_sha="$(
            sha256sum "$GITHUB_WORKSPACE/downloaded.apk" | awk '{print $1}'
          )"

          if [[ "$downloaded_sha" != "$APK_SHA256" ]]; then
            echo "::error::Downloaded APK checksum mismatch."
            echo "::error::Expected (built):  $APK_SHA256"
            echo "::error::Actual (downloaded): $downloaded_sha"
            exit 1
          fi

          size="$(stat -c%s "$GITHUB_WORKSPACE/downloaded.apk")"
          if [[ "$size" -lt 1048576 ]]; then
            echo "::error::Downloaded APK is suspiciously small ($size bytes)."
            exit 1
          fi

          file_type="$(file -b "$GITHUB_WORKSPACE/downloaded.apk")"
          if ! grep -qi 'zip\|android' <<< "$file_type"; then
            echo "::error::Downloaded file is not an APK/ZIP (detected: $file_type)."
            exit 1
          fi

          echo "Verified download: $APK_NAME ($size bytes, sha256=$downloaded_sha)"

      # ------------------------------------------------------------------
      # Stage 16b - Remove an orphaned upload
      #
      # Runs only when the APK reached the server but the backend never
      # accepted the release. Such a file is referenced by no release, and its
      # name is unique to this build, so deleting it cannot affect any live or
      # rollback artifact. If publishing DID succeed and a later verification
      # failed, the file is kept on purpose: follow docs/ROLLBACK.md.
      # ------------------------------------------------------------------
      - name: Remove orphaned APK after failed publish
        if: failure() && steps.upload.outcome == 'success' && steps.publish.outcome != 'success'
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ vars.SERVER_PORT }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
        run: |
          set -euo pipefail

          key_file="$(mktemp)"
          hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT

          printf '%s\n' "$SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$hosts_file"
          chmod 600 "$hosts_file"

          remote_path="${SERVER_REMOTE_DIR}/${APK_NAME}"

          ssh -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$hosts_file" \
            -o ConnectTimeout=20 \
            -p "${PORT:-22}" -i "$key_file" \
            "${USER}@${HOST}" "rm -f '${remote_path}'"

          echo "Removed unpublished upload ${remote_path}."

      # ------------------------------------------------------------------
      # Stage 17 - Cleanup
      # ------------------------------------------------------------------
      - name: Clean up temporary files
        if: always()
        shell: bash
        run: |
          rm -f \
            "$GITHUB_WORKSPACE/android/app/upload-keystore.jks" \
            "$GITHUB_WORKSPACE/android/keystore.properties" \
            "$GITHUB_WORKSPACE/changelog.txt" \
            "$GITHUB_WORKSPACE/latest.json" \
            "$GITHUB_WORKSPACE/publish_response.json" \
            "$GITHUB_WORKSPACE/downloaded.apk" \
            "$GITHUB_WORKSPACE"/app-v*.apk \
            "$GITHUB_WORKSPACE"/app-v*.apk.sha256

          echo "Temporary files cleaned up."

