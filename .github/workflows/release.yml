name: Release Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'pubspec.yaml'
      - 'CHANGELOG.md'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Backend
  BACKEND_BASE_URL: 'https://mr-edu.ertiqaa.site/api/v1'

  # Server deploy location (no credentials here)
  SERVER_REMOTE_DIR: '/var/www/educational_platforms/mr-edu.ertiqaa.site/storage/app/public/releases'

jobs:
  release:
    name: Build, upload and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      apk_name: ${{ steps.apk.outputs.apk_name }}

    steps:

      # ------------------------------------------------------------------
      # Stage 1 - Checkout
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Stage 2 - Setup Java
      # ------------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ------------------------------------------------------------------
      # Stage 3 - Setup Flutter
      # ------------------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ------------------------------------------------------------------
      # Stage 4 - Dependencies
      # ------------------------------------------------------------------
      - name: Flutter pub get
        run: flutter pub get

      # ------------------------------------------------------------------
      # Stage 5 - Read version from pubspec.yaml
      # ------------------------------------------------------------------
      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version_line="$(grep -m1 -E '^version: ' pubspec.yaml | sed -E 's/^version:[[:space:]]*//')"

          if [[ -z "$version_line" ]]; then
            echo "::error::Could not find a 'version:' line in pubspec.yaml"
            exit 1
          fi

          version_name="${version_line%%+*}"
          version_code="${version_line#*+}"

          if [[ -z "$version_name" || -z "$version_code" ]]; then
            echo "::error::pubspec.yaml version '$version_line' must be <name>+<code> e.g. 2.1.0+2"
            exit 1
          fi

          if ! [[ "$version_code" =~ ^[0-9]+$ ]]; then
            echo "::error::version_code '$version_code' is not a positive integer"
            exit 1
          fi

          if ! [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version_name '$version_name' is not in X.Y.Z format"
            exit 1
          fi

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

          echo "VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"

          echo "Extracted version_name=$version_name version_code=$version_code"

      # ------------------------------------------------------------------
      # Stage 6 - Read changelog
      # ------------------------------------------------------------------
      - name: Read changelog
        shell: bash
        run: |
          set -euo pipefail

          version_name="${{ steps.version.outputs.version_name }}"

          if [[ ! -f CHANGELOG.md ]]; then
            echo "::error::CHANGELOG.md not found at repository root"
            exit 1
          fi

          changelog="$(awk -v v="## $version_name" '
            $0 == v { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"

          if [[ -z "$changelog" ]]; then
            echo "::error::No changelog section found for version '$version_name' in CHANGELOG.md"
            echo "::error::Add a section like: ## $version_name"
            exit 1
          fi

          printf '%s\n' "$changelog" > "$GITHUB_WORKSPACE/changelog.txt"

          echo "Changelog section for $version_name:"
          echo "-------------------------------"
          cat "$GITHUB_WORKSPACE/changelog.txt"
          echo "-------------------------------"

      # ------------------------------------------------------------------
      # Stage 7 - Pre-check latest release on Backend
      # ------------------------------------------------------------------
      - name: Pre-check latest release on Backend
        shell: bash
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -uo pipefail

          http_code="000"
          body=""

          for attempt in 1 2 3; do
            resp="$(set +e; curl -sS -w '\n%{http_code}' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              "$BACKEND_BASE_URL/app/releases/latest"; set -e)" || true

            http_code="$(echo "$resp" | tail -n1)"
            body="$(echo "$resp" | sed '$d')"

            case "$http_code" in
              200|404|204)
                break
                ;;
            esac

            if [[ "$attempt" -lt 3 ]]; then
              sleep 5
            fi
          done

          case "$http_code" in
            200)
              latest_code="$(echo "$body" | jq -r '[(.data // .) as $o | ($o.version_code // 0)] | first')"

              if [[ -z "$latest_code" ]]; then
                echo "::error::Backend latest response did not include a numeric version_code."
                echo "$body" | head -c 500 >&2
                exit 1
              fi

              if [[ "$latest_code" -ge "$VERSION_CODE" ]]; then
                echo "::error::Backend already has version_code=$latest_code which is >= this build's version_code=$VERSION_CODE."
                echo "::error::Increment the version in pubspec.yaml before releasing."
                exit 1
              fi

              echo "Pre-check passed: latest backend code ($latest_code) < this build ($VERSION_CODE)"
              ;;

            404|204)
              echo "Backend has no releases yet (HTTP $http_code). Proceeding."
              ;;

            *)
              echo "::error::Could not reach/verify Backend latest release (HTTP $http_code after 3 attempts)."
              echo "$body" | head -c 500 >&2
              exit 1
              ;;
          esac

      # ------------------------------------------------------------------
      # Stage 8 - Prepare signing keystore
      #
      # IMPORTANT:
      # build.gradle.kts is inside android/app
      #
      # Therefore storeFile=upload-keystore.jks
      # resolves to:
      #
      # android/app/upload-keystore.jks
      # ------------------------------------------------------------------
      - name: Prepare signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$ANDROID_KEYSTORE_BASE64" ||
                -z "$KEYSTORE_PASSWORD" ||
                -z "$KEY_ALIAS" ||
                -z "$KEY_PASSWORD" ]]; then

            echo "::error::Missing one or more signing secrets."
            exit 1
          fi

          # Decode keystore directly into android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d \
            > "$GITHUB_WORKSPACE/android/app/upload-keystore.jks"

          if [[ ! -s "$GITHUB_WORKSPACE/android/app/upload-keystore.jks" ]]; then
            echo "::error::Decoded keystore file is empty. Verify ANDROID_KEYSTORE_BASE64."
            exit 1
          fi

          # keystore.properties is located in android/
          keystore_props="$GITHUB_WORKSPACE/android/keystore.properties"

          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$keystore_props"

          echo "Keystore prepared successfully."
          echo "Keystore location: android/app/upload-keystore.jks"

      # ------------------------------------------------------------------
      # Stage 9 - Build signed release APK
      # ------------------------------------------------------------------
      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk --release

          echo "Release APK built successfully."

      # ------------------------------------------------------------------
      # Stage 9b - Verify the release APK is signed with the Production keystore
      #
      # Guards against a Debug-signing fallback: the certificate used to sign
      # the APK MUST be the same certificate stored in ANDROID_KEYSTORE_BASE64.
      # ------------------------------------------------------------------
      - name: Verify APK signature matches Production keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          apk="$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-release.apk"
          keystore="$GITHUB_WORKSPACE/android/app/upload-keystore.jks"

          test -f "$apk" || { echo "::error::Release APK not found."; exit 1; }
          test -f "$keystore" || { echo "::error::Keystore not found."; exit 1; }

          # Locate apksigner (Android SDK build-tools).
          apksigner=""
          for sdk in "$ANDROID_SDK_ROOT" "$ANDROID_HOME" "$ANDROID_SDK_HOME"; do
            if [[ -d "${sdk}/build-tools" ]]; then
              apksigner="$(find "${sdk}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n1)"
              [[ -n "$apksigner" ]] && break
            fi
          done

          test -n "$apksigner" || { echo "::error::apksigner not found in Android SDK build-tools."; exit 1; }

          expected="$(
            keytool -list -v \
              -keystore "$keystore" \
              -alias "$KEY_ALIAS" \
              -storepass "$KEYSTORE_PASSWORD" 2>/dev/null |
            sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*([0-9A-Fa-f:]+)/\1/p' |
            head -n1 | tr -d ':' | tr 'A-F' 'a-f'
          )"

          actual="$(
            "$apksigner" verify --print-certs "$apk" 2>/dev/null |
            sed -nE 's/.*certificate SHA-256 digest: ([0-9a-f]{64}).*/\1/p' |
            head -n1
          )"

          if [[ -z "$expected" || -z "$actual" ]]; then
            echo "::error::Could not read signing certificate(s) (expected='$expected' actual='$actual')."
            exit 1
          fi

          if [[ "$expected" != "$actual" ]]; then
            echo "::error::Release APK is NOT signed with the Production keystore."
            echo "::error::Expected SHA-256: $expected"
            echo "::error::Actual SHA-256:   $actual"
            echo "::error::The APK must be signed with the keystore from ANDROID_KEYSTORE_BASE64 only."
            exit 1
          fi

          echo "Verified: release APK signed with the Production keystore (SHA-256: $actual)."

      # ------------------------------------------------------------------
      # Stage 10 - Locate and rename APK
      # ------------------------------------------------------------------
      - name: Locate and rename APK
        id: apk
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail

          apk="$(find build/app/outputs/flutter-apk \
            -name 'app-release.apk' \
            -type f | head -n1)"

          if [[ -z "$apk" ]]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          apk_name="app-v${VERSION_NAME}.apk"

          cp "$apk" "$GITHUB_WORKSPACE/$apk_name"

          echo "APK_FILE=${GITHUB_WORKSPACE}/${apk_name}" >> "$GITHUB_ENV"
          echo "APK_NAME=$apk_name" >> "$GITHUB_ENV"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

          if [[ ! -f "$GITHUB_WORKSPACE/$apk_name" ]]; then
            echo "::error::Renamed APK missing."
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/$apk_name"

      # ------------------------------------------------------------------
      # Stage 11 - Upload APK to server
      # ------------------------------------------------------------------
      - name: Upload APK to server
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ vars.SERVER_PORT }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
        run: |
          set -euo pipefail

          if [[ -z "$SSH_KEY" || -z "$HOST" || -z "$USER" ]]; then
            echo "::error::Missing SSH secrets."
            exit 1
          fi

          ssh_port="${PORT:-22}"

          key_file="$(mktemp)"

          printf '%s\n' "$SSH_KEY" > "$key_file"
          chmod 600 "$key_file"

          hosts_file=""

          if [[ -n "${SERVER_KNOWN_HOSTS:-}" ]]; then
            hosts_file="$(mktemp)"

            printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$hosts_file"
            chmod 600 "$hosts_file"

            ssh_extra=(-o "UserKnownHostsFile=$hosts_file")
          else
            ssh_extra=(
              -o StrictHostKeyChecking=no
              -o UserKnownHostsFile=/dev/null
            )
          fi

          echo "Uploading $APK_NAME to $USER@$HOST:$SERVER_REMOTE_DIR/..."

          scp "${ssh_extra[@]}" \
            -P "$ssh_port" \
            -i "$key_file" \
            "$GITHUB_WORKSPACE/$APK_NAME" \
            "${USER}@${HOST}:${SERVER_REMOTE_DIR}/${APK_NAME}"

          echo "SCP upload completed."

          rm -f "$key_file" "$hosts_file"

      # ------------------------------------------------------------------
      # Stage 12 - Verify uploaded APK
      # ------------------------------------------------------------------
      - name: Verify uploaded APK on server
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ vars.SERVER_PORT }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
        run: |
          set -euo pipefail

          ssh_port="${PORT:-22}"

          key_file="$(mktemp)"

          printf '%s\n' "$SSH_KEY" > "$key_file"
          chmod 600 "$key_file"

          hosts_file=""

          if [[ -n "${SERVER_KNOWN_HOSTS:-}" ]]; then
            hosts_file="$(mktemp)"

            printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$hosts_file"
            chmod 600 "$hosts_file"

            ssh_extra=(-o "UserKnownHostsFile=$hosts_file")
          else
            ssh_extra=(
              -o StrictHostKeyChecking=no
              -o UserKnownHostsFile=/dev/null
            )
          fi

          remote_path="${SERVER_REMOTE_DIR}/${APK_NAME}"

          if ! ssh "${ssh_extra[@]}" \
            -p "$ssh_port" \
            -i "$key_file" \
            "${USER}@${HOST}" \
            "test -f '${remote_path}'"; then

            echo "::error::Uploaded APK not found on server at ${remote_path}"

            rm -f "$key_file" "$hosts_file"
            exit 1
          fi

          echo "Verified APK exists on server: ${remote_path}"

          rm -f "$key_file" "$hosts_file"

      # ------------------------------------------------------------------
      # Stage 13 - Login to Backend
      # ------------------------------------------------------------------
      - name: Login to Backend
        shell: bash
        env:
          BACKEND_USERNAME: ${{ secrets.BACKEND_USERNAME }}
          BACKEND_PASSWORD: ${{ secrets.BACKEND_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$BACKEND_USERNAME" || -z "$BACKEND_PASSWORD" ]]; then
            echo "::error::Missing Backend credentials secrets."
            exit 1
          fi

          login_payload="$(jq -n \
            --arg u "$BACKEND_USERNAME" \
            --arg p "$BACKEND_PASSWORD" \
            '{username: $u, password: $p}')"

          resp="$(curl -sS -w '\n%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -d "$login_payload" \
            "$BACKEND_BASE_URL/auth/login")"

          http_code="$(echo "$resp" | tail -n1)"
          body="$(echo "$resp" | sed '$d')"

          if [[ "$http_code" != "2"* ]]; then
            echo "::error::Backend login failed (HTTP $http_code)."
            echo "$body" | head -c 500 >&2
            exit 1
          fi

          token="$(echo "$body" | jq -r '.data.token // empty')"

          if [[ -z "$token" ]]; then
            echo "::error::Login response did not contain data.token."
            echo "$body" | head -c 500 >&2
            exit 1
          fi

          echo "::add-mask::$token"

          echo "BACKEND_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"

          echo "Logged in to Backend successfully."

      # ------------------------------------------------------------------
      # Stage 14 - Publish release to Backend API
      # ------------------------------------------------------------------
      - name: Publish release to Backend
        id: publish
        shell: bash
        env:
          BACKEND_USERNAME: ${{ secrets.BACKEND_USERNAME }}
          BACKEND_PASSWORD: ${{ secrets.BACKEND_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
        run: |
          set -euo pipefail

          changelog_file="$GITHUB_WORKSPACE/changelog.txt"

          payload="$(jq -n \
            --argjson vc "$VERSION_CODE" \
            --arg vn "$VERSION_NAME" \
            --arg cl "$(cat "$changelog_file")" \
            --arg fn "$APK_NAME" \
            '{
              version_code: $vc,
              version_name: $vn,
              changelog: $cl,
              file_name: $fn
            }')"

          do_login() {
            local login_payload
            local resp
            local code
            local body
            local parsed_token

            login_payload="$(jq -n \
              --arg u "$BACKEND_USERNAME" \
              --arg p "$BACKEND_PASSWORD" \
              '{username: $u, password: $p}')"

            resp="$(curl -sS -w '\n%{http_code}' \
              -X POST \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -d "$login_payload" \
              "$BACKEND_BASE_URL/auth/login")"

            code="$(echo "$resp" | tail -n1)"
            body="$(echo "$resp" | sed '$d')"

            if [[ "$code" != "2"* ]]; then
              echo "::error::Backend login failed while refreshing token."
              echo "$body" | head -c 500 >&2
              return 1
            fi

            parsed_token="$(echo "$body" | jq -r '.data.token // empty')"

            if [[ -z "$parsed_token" ]]; then
              echo "::error::Refreshed login did not contain data.token."
              return 1
            fi

            echo "::add-mask::$parsed_token"

            TOKEN="$parsed_token"
          }

          TOKEN="${BACKEND_ACCESS_TOKEN:-}"

          if [[ -z "$TOKEN" ]]; then
            echo "::error::No Backend Access Token available."
            exit 1
          fi

          http_code=""

          for attempt in 1 2; do

            echo "POSTing release to $BACKEND_BASE_URL/app/releases (attempt $attempt)..."

            response="$(curl -sS -w '\n%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -d "$payload" \
              "$BACKEND_BASE_URL/app/releases")"

            http_code="$(echo "$response" | tail -n1)"
            body="$(echo "$response" | sed '$d')"

            if [[ "$http_code" == "2"* ]]; then
              echo "Backend responded with HTTP $http_code. Release published."
              break
            fi

            if [[ "$http_code" == "401" && "$attempt" == "1" ]]; then

              echo "::warning::Backend returned 401 Unauthorized."
              echo "::warning::Logging in again and retrying once..."

              do_login

              continue
            fi

            echo "::error::Backend rejected the release publish (HTTP $http_code)."
            echo "::error::$body"

            exit 1
          done

          if [[ "$http_code" != "2"* ]]; then
            echo "::error::Release publish failed after retry (final HTTP $http_code)."
            exit 1
          fi

          echo "::group::Publish response"
          echo "$body"
          echo "::endgroup::"

      # ------------------------------------------------------------------
      # Stage 15 - Verify latest release
      # ------------------------------------------------------------------
      - name: Verify latest release on Backend
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do

            echo "Verification attempt $attempt of 3..."

            resp="$(curl -sS -w '\n%{http_code}' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              "$BACKEND_BASE_URL/app/releases/latest")"

            code="$(echo "$resp" | tail -n1)"
            body="$(echo "$resp" | sed '$d')"

            if [[ "$code" == "200" ]]; then
              echo "$body" > "$GITHUB_WORKSPACE/latest.json"
              break
            fi

            if [[ "$attempt" == "3" ]]; then
              echo "::error::Backend latest endpoint did not return HTTP 200 after 3 attempts."
              echo "::error::$body"
              exit 1
            fi

            sleep 5
          done

          latest="$GITHUB_WORKSPACE/latest.json"

          row="$(jq -r '
            [( .data // . ) as $o |
            ($o.version_code // ""),
            ($o.version_name // ""),
            ($o.file_name // "")] |
            @tsv
          ' "$latest")"

          IFS=$'\t' read -r got_code got_name got_file <<< "$row"

          exp_code="$VERSION_CODE"
          exp_name="$VERSION_NAME"
          exp_file="$APK_NAME"

          ok=true

          if [[ "$got_code" != "$exp_code" ]]; then
            echo "::error::version_code mismatch: expected $exp_code, got $got_code"
            ok=false
          fi

          if [[ "$got_name" != "$exp_name" ]]; then
            echo "::error::version_name mismatch: expected $exp_name, got $got_name"
            ok=false
          fi

          if [[ "$got_file" != "$exp_file" ]]; then
            echo "::error::file_name mismatch: expected $exp_file, got $got_file"
            ok=false
          fi

          if [[ "$ok" != true ]]; then
            echo "Returned latest release:"
            cat "$latest"
            exit 1
          fi

          echo "Verified latest release matches published release:"
          echo "version_code=$got_code"
          echo "version_name=$got_name"
          echo "file_name=$got_file"

      # ------------------------------------------------------------------
      # Stage 16 - Verify download endpoint
      # ------------------------------------------------------------------
      - name: Verify download endpoint (HEAD)
        continue-on-error: true
        shell: bash
        run: |
          set -e

          code="$(curl -sS \
            -o /dev/null \
            -w '%{http_code}' \
            --head \
            "$BACKEND_BASE_URL/app/releases/latest/download")"

          echo "Download endpoint HEAD returned HTTP $code"

          if [[ "$code" == "000" ]]; then
            echo "::warning::Could not reach download endpoint."
          else
            echo "Download endpoint reachable (HTTP $code)."
          fi

      # ------------------------------------------------------------------
      # Stage 17 - Cleanup
      # ------------------------------------------------------------------
      - name: Clean up temporary files
        if: always()
        shell: bash
        run: |
          rm -f \
            "$GITHUB_WORKSPACE/android/app/upload-keystore.jks" \
            "$GITHUB_WORKSPACE/android/keystore.properties" \
            "$GITHUB_WORKSPACE/changelog.txt" \
            "$GITHUB_WORKSPACE/latest.json" \
            "$GITHUB_WORKSPACE/publish_response.json" \
            "$GITHUB_WORKSPACE"/app-v*.apk

          echo "Temporary files cleaned up."

